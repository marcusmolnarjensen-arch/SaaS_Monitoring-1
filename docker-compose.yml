services:
  db:
    image: postgres:17
    env_file: password.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      retries: 10

  checker:
    build: .
    env_file: password.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: python app.py
    env_file: password.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: